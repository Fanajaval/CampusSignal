<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html">
<h:head><title>CampusSignal - Connexion</title><h:outputStylesheet library="css" name="app.css"/></h:head>
<h:body>
    <main class="auth-shell"><section class="auth-panel">
        <p class="eyebrow">CampusSignal</p><h1>Bienvenue sur votre campus.</h1>
        <p class="muted">Connectez-vous pour signaler un problème ou suivre sa résolution.</p>
        <h:form styleClass="report-form"><h:messages styleClass="messages"/>
            <div class="field"><h:outputLabel for="email" value="Adresse email"/><h:inputText id="email" value="#{loginBean.email}" required="true" requiredMessage="L'email est obligatoire."/></div>
            <div class="field"><h:outputLabel for="password" value="Mot de passe"/><h:inputSecret id="password" value="#{loginBean.password}" required="true" requiredMessage="Le mot de passe est obligatoire."/></div>
            <h:commandButton value="Se connecter" action="#{loginBean.login}" styleClass="button button-primary form-submit"/>
        </h:form>
        <p class="auth-link">Pas encore de compte ? <h:link value="Créer un compte étudiant" outcome="register"/></p>
        <div class="demo-access"><strong>Comptes de démonstration</strong><span>Étudiant : student@campus.local / student123</span><span>Responsable : admin@campus.local / admin123</span></div>
    </section></main>
</h:body>
</html>
