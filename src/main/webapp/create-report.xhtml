<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core" xmlns:pt="jakarta.faces.passthrough">
<h:head>
    <title>CampusSignal - Nouveau signalement</title>
    <h:outputStylesheet library="css" name="app.css"/>
    <h:outputScript library="js" name="toast.js" target="head"/>
</h:head>
<h:body>
    <header class="topbar"><div><span class="eyebrow">CampusSignal</span><h1>Nouveau signalement</h1></div>
        <div class="nav-actions">
            <h:link value="Tableau de bord" outcome="dashboard" styleClass="button button-quiet"/>
            <h:link value="Mes signalements" outcome="my-reports" styleClass="button button-quiet"/>
        </div>
    </header>
    <main class="page-shell narrow-shell"><section class="form-panel">
        <p class="eyebrow">Déclarer un problème</p><h2>Que se passe-t-il sur le campus ?</h2>
        <p class="muted">Décrivez le problème pour permettre une intervention rapide.</p>
        <h:form styleClass="report-form"><h:messages styleClass="messages"/>
            <div class="field"><h:outputLabel for="title" value="Titre"/><h:inputText id="title" value="#{reportBean.title}" required="true" requiredMessage="Le titre est obligatoire." pt:placeholder="Ex. : Fuite d'eau au premier étage"/></div>
            <div class="field"><h:outputLabel for="category" value="Catégorie"/><h:selectOneMenu id="category" value="#{reportBean.category}" required="true" requiredMessage="La catégorie est obligatoire."><f:selectItem itemLabel="Sélectionner une catégorie" noSelectionOption="true"/><f:selectItems value="#{reportBean.categories}" var="item" itemValue="#{item}" itemLabel="#{item.label}"/></h:selectOneMenu></div>
            <div class="field"><h:outputLabel for="location" value="Lieu"/><h:inputText id="location" value="#{reportBean.location}" required="true" requiredMessage="Le lieu est obligatoire." pt:placeholder="Ex. : Bâtiment A, salle 204"/></div>
            <div class="field"><h:outputLabel for="reporter" value="Étudiant connecté"/><h:inputText id="reporter" value="#{reportBean.reporter}" readonly="true" pt:placeholder="Votre compte étudiant"/><span class="field-hint">Votre signalement sera associé à votre compte.</span></div>
            <div class="field"><h:outputLabel for="description" value="Description"/><h:inputTextarea id="description" value="#{reportBean.description}" rows="6" required="true" requiredMessage="La description est obligatoire." pt:placeholder="Ex. : L'eau coule depuis ce matin et le sol devient glissant."/></div>
            <h:commandButton value="Envoyer le signalement" action="#{reportBean.createReport}" styleClass="button button-primary form-submit"/>
        </h:form>
    </section></main>
</h:body>
</html>
